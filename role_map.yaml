      - "stick:intraday:read"
      - "stick:depth:read"
      - "stick:financial:read"
      - "stick:ext:read"
      - "stick:ext:write"
      - "stick:regime:read"
      - "stick:analysis:read"
      - "stick:analysis:write"
      - "stick:data:read"
      - "stick:settings:read"
      # 菜单可见性 (导师版全 18 菜单, 无平台管理)
      - "stick:menu:watchlist"
      - "stick:menu:screener"
      - "stick:menu:factors"
