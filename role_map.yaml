# SnStick 用户角色 → 功能权限映射表 (v2.5 定稿)
#
# 用途: 服务端 agti 账号互通形态下, 将 AGTi 订阅角色 (sys_role.role_key)
#       映射为 SnStick 功能权限点。请求进入时由 RequirePerm 依赖按
#       request.state.identity.roles 判定, 无权限 → 403 NO_PERM。
#
# 权限点命名: stick:<模块>:<动作>   (模块 = 功能域, 动作 = read/write/run/admin)
# 多角色取并集; admin 直通 *:*:* (全功能, 见 permissions.py 内置逻辑)。
#
# 变更方式 (K1): 改此文件 + 重启容器, 生效 < 1 分钟。
#   P2 (按需): overlay.json 热加载, 准入门槛 = 年改档 >= 3 次。
#
# 注意: 本表只控制「功能权限」(能否用某功能), 与 TickFlow 套餐能力
#       (capset, 控制数据吞吐/行情深度) 正交叠加, 互不影响。
#
# ── v2.5 分级原则 (菜单资产按内核权重分配) ──────────────────────
#   核心资产级: 回测/因子/策略(选股)/复盘 — 策略与因子库资产、AI 生成、高算力
#   高价值工具: 监控中心/市场环境/异动监控/连板梯队/概念分析/行业分析/
#               财务分析/个股分析 —— 预警基础设施、独家批算、AI 流式分析
#   中价值工具: 自选/持仓提醒/信号库/看板 —— 个人数据资产
#   通用信息:   指数 —— 公开数据展示
#   资产治理(数据/设置): 仅 admin/enterprise (自己人)
#   收费梯度: 高级版 = 标准版 + 全部核心资产级 + 全部高价值工具;
#             标准版 = 体验版 + 持仓提醒差异化; 体验版最小可用。
#
# 菜单数量梯度: admin 18+ / enterprise 18 / mentor 15 / agent 13 /
#               premium 16 / standard 7 / common 5
#
# 权限点模块: watchlist 自选 / kline 日K / screener 选股 / strategy 策略
#   signals 信号 / backtest 回测 / mining 因子挖掘 / factors 因子
#   intraday 分钟K / depth 五档 / financial 财务 / ext 扩展数据
#   regime 市场环境 / review 复盘 / abnormal 异动监控 / analysis 分析
#   data 数据 / settings 设置 / admin 管理
#
# 菜单权限点 (stick:menu:<页面slug>): 仅控制前端菜单可见性, 与功能权限点正交。
#   slug: watchlist 自选 / screener 策略 / factors 因子 / backtest 回测 /
#     lots 持仓提醒 / signals 信号库 / stock-analysis 个股分析 /
#     limit-ladder 连板梯队 / concept-analysis 概念分析 /
#     industry-analysis 行业分析 / financials 财务分析 / monitor 监控中心 /
#     regime 市场环境 / abnormal 异动监控 / review 复盘 / indices 指数 /
#     data 数据; 看板恒显 (perm: undefined)。
#
# 功能权限点配对 (v2.5 新增):
#   stick:review:read   → POST /api/market-recap/* 全套 (AI 复盘/报告/龙虎榜/风向标)
#   stick:abnormal:read → GET  /api/abnormal/*   全套 (盘中异动/边缘总览)
#   与菜单可见性严格同角色集合:
#     review   → enterprise/mentor/agent/premium
#     abnormal → enterprise/mentor/premium
#   (菜单不可见 = API 不可调, 杜绝「菜单藏了但接口裸奔」)
#
# data:write 语义 (v2.4): 破坏性数据治理操作仅 admin/enterprise。
# settings:write 语义 (v2.5): 数据源凭证/AI凭证/数据源配置/调度/重算
#   等治理操作仅 admin/enterprise; 个人偏好 (自选列/菜单顺序等) 保持登录可用。

roles:
  # 超级管理员: 全功能 + 管理页 (通配, 代码内判定)
  admin:
    perms: ["*:*:*"]

