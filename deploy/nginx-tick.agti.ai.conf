server {
    listen 443 ssl;
    http2 on;
    server_name tick.agti.ai;

    # 证书路径按你的实际存放调整 (certbot 默认路径如下)
    ssl_certificate     /etc/letsencrypt/live/tick.agti.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tick.agti.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上游: 本机 docker 容器 (HOST=127.0.0.1, PORT=3018)
    # 若 PORT 不是 3018, 改成实际端口
    location / {
        proxy_pass http://127.0.0.1:3018;

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === SSE 流式接口 (回测/因子挖掘的实时进度推送) ===
        # FastAPI 的 StreamingResponse 需要关闭缓冲, 否则进度条不动/分批卡顿
        proxy_buffering off;
        # SSE 长连接: 回测/挖掘可能持续数小时, 默认 60s 会掐断
        proxy_read_timeout 3600s;
        # HTTP/1.1 + 空透传 (禁用 upstream keepalive 之外的连接复用头)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 大请求体 (AI 生成策略/截图导入等场景)
    client_max_body_size 20m;
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name tick.agti.ai;
    return 301 https://$host$request_uri;
}
